<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- پس‌زمینه با گرادینت تاریک و عمیق -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1E1E2E"/>
      <stop offset="100%" stop-color="#0F0F17"/>
    </radialGradient>

    <!-- گرادینت اصلی حرف N و سپر -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- گرادینت دوم برای عمق دادن -->
    <linearGradient id="secondaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>

    <!-- افکت درخشش Aether -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- پس‌زمینه گرد (Adaptive Icon Friendly) -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- حلقه‌های مداری Aether (نماد شبکه و فضا) -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#4FACFE" stroke-width="3" stroke-dasharray="8 12" opacity="0.3"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-dasharray="4 16" opacity="0.2"/>

  <!-- ساختار حرف N ترکیبی با سپر امنیتی -->
  <g filter="url(#glow)">
    <!-- ستون سمت چپ N -->
    <path d="M160 140 C160 140 160 340 160 360 C160 375 175 380 185 370 L230 320 L230 140 Z" fill="url(#secondaryGrad)"/>
    
    <!-- خط مورب N (پل ارتباطی شبکه) -->
    <path d="M185 140 L327 355 C335 367 352 360 352 345 L352 160 C352 145 335 150 325 160 L280 210 L280 320 Z" fill="url(#primaryGrad)"/>

    <!-- نماد قفل / هسته امنیتی در مرکز N -->
    <circle cx="256" cy="256" r="28" fill="#0F0F17" stroke="url(#primaryGrad)" stroke-width="6"/>
    <circle cx="256" cy="256" r="10" fill="#00F2FE"/>
  </g>
</svg>
